<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
     <link rel="icon" type="image/jpg" href="image/bite.jpg" />
    <meta name="description" content="Un jeu de réflexion où vous devez enfiler les chattes">
    <title>Bite volante</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0824
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #000;
        }

        #loading-screen img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="loading-screen" aria-label="Chargement">
        <img src="image/logo.jpg" alt="">
    </div>
    <canvas id="c"></canvas>
    <script src="jeu.js"></script>
    <script>
        const loadingStarted = performance.now();
        window.addEventListener("load", () => {
            const delay = Math.max(0, 2500 - (performance.now() - loadingStarted));
            setTimeout(() => document.getElementById("loading-screen")?.remove(), delay);
        });
    </script>
</body>

</html>
